# SonarQube Cloud project scope (#238). The analysis is advisory: it gates no
# merge, and a finding is acted on by hand in a normal change.
sonar.projectKey=FerroHEALTH_FerroSYS
sonar.organization=ferrohealth
sonar.projectName=FerroSYS
sonar.sourceEncoding=UTF-8

# Every hand-written tree, the scripts and workflows included.
sonar.sources=.

# Excluded, one reason each:
#   **/target/**: build output.
#   docs/specs/**: the OpenTelemetry semantic conventions and the FerroPULSE
#     schemas, vendored verbatim with their PROVENANCE.md.
#   images: binary, nothing to analyze.
sonar.exclusions=\
  **/target/**,\
  docs/specs/**,\
  **/*.png,\
  **/*.svg,\
  **/*.ico

# Coverage: sonar.yml imports the lcov report of the instrumented workspace
# tests. The shell, run by CI and the hooks, and the test code itself stay
# analyzed for findings and leave the coverage measure.
sonar.rust.lcov.reportPaths=lcov.info
sonar.coverage.exclusions=\
  scripts/**,\
  .claude/**,\
  **/tests/**

<!-- The FerroSYS lockup in the parent's steel, the construction and the
     wordmark of FerroHEALTH's assets/brand/ferrohealth-lockup-auto.svg. One file serves both themes through prefers-color-scheme. -->
<svg xmlns="http://www.w3.org/2000/svg" width="230" height="64" viewBox="0 0 230 64" role="img" aria-label="FerroSYS">
  <title>FerroSYS</title>
  <style>
    .m1 { stroke: #3F6070 }
    .m1f { fill: #3F6070 }
    .m2 { stroke: #8FB6C4 }
    .ferro { fill: #0F172A }
    .suf { fill: #3F6070 }
    @media (prefers-color-scheme: dark) {
      .m1 { stroke: #8FB6C4 }
      .m1f { fill: #8FB6C4 }
      .m2 { stroke: #F1F5F9 }
      .ferro { fill: #F1F5F9 }
      .suf { fill: #8FB6C4 }
    }
  </style>
  <g fill="none" stroke-width="4.6" stroke-linecap="round">
    <path class="m1" d="M11 42 A21 21 0 0 1 53 42"/>
    <path class="m2" d="M32 42 L44 27"/>
    <path class="m2" d="M20 54 H44"/>
  </g>
  <circle class="m1f" cx="32" cy="42" r="5"/>
  <text x="76" y="44" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.3"><tspan class="ferro">Ferro</tspan><tspan class="suf">SYS</tspan></text>
</svg>

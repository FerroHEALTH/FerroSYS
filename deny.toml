# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# The only advisory gate: it reads the RustSec database cargo audit does and
# adds yanked, licences, bans and sources.

# Every feature of every crate is in the graph, so a dependency an optional
# feature links is checked as one a default build links.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# An exception is dated and names the event that deletes it. Its argument
# lives once, in security/vex/rust-advisories.toml, which
# scripts/checks/vex-reachability.sh checks against the resolved graph.
ignore = [
  # 2026-11-25: Marvin attack in rsa 0.9, which pgp 0.21 requires; no fixed
  # release. DELETING EVENT: an rPGP release on rsa 0.10.
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 via pgp; ferrohealth-openpgp-pq runs no RSA operation (security/vex/rust-advisories.toml)" },
  # 2026-11-25: timing variability in crypto-bigint 0.5, which pgp 0.21
  # requires through cx448 and elliptic-curve 0.13. DELETING EVENT: an rPGP
  # release on elliptic-curve 0.14 and crypto-bigint 0.6 (rpgp/rpgp#573).
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via pgp; ferrohealth-openpgp-pq runs no ECDSA or Ed448 operation (security/vex/rust-advisories.toml)" },
]

[licenses]
version = 2
# Dev-dependencies are compiled here and in CI, so their licences are read too.
include-dev = true
# Permissive licences a BUSL-1.1 project can depend on and its Apache 2.0
# Change License admits. A licence joins the day a dependency needs it.
allow = [
  "Apache-2.0",
  "MIT",
  # The ICU crates url links through idna, the Unicode data under its own
  # licence.
  "Unicode-3.0",
  # aws-lc-rs and aws-lc-sys, the crypto provider rustls links for the OTLP
  # export's TLS, and the crates beside them.
  "ISC",
  "MIT-0",
  "BSD-3-Clause",
  # hashbrown, under the HTTP stack's index maps.
  "Zlib",
  # The Mozilla root store the platform verifier of reqwest's rustls engine
  # carries, for the usage report's collector.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The project's own crates are BUSL-1.1 (LICENSE); each joins the list with
# its first code.
exceptions = [
  { allow = ["BUSL-1.1"], crate = "ferrohealth-secret" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-config" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-telemetry" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-health" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-server" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-usage-report" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-perf" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-openpgp-pq" },
  # The forwarder ratchet's detector under tools/, never published.
  { allow = ["BUSL-1.1"], crate = "forwarders" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# zizmor configuration (https://docs.zizmor.sh/configuration/).
rules:
  # The audit asks for the self-repository `uses: $/...` form in place of the
  # workspace-relative `uses: ./...`; actionlint 1.7.12 refuses the `$/` form,
  # and both linters gate, so the workspace-relative form stays.
  self-repository:
    disable: true

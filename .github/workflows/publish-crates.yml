# The manual crates.io lane: a dry run by default, and the recovery path when
# a release's crates leg fails ("already exists" counts as done), dispatched
# at that release's tag only. Trusted
# Publishing (OIDC) through rust-lang/crates-io-auth-action; the crate carries
# one publisher entry naming this file and one naming release.yml, both under
# the `crates-io` environment (.claude/rules/crates-publishing.md).
name: Publish crates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish to crates.io (false = dry run)"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  dry-run:
    name: dry run
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # NOTE: Cargo packages the workspace members together, so a crate verifies
      # against the workspace crates it depends on before those are on crates.io.
      - run: cargo publish --workspace --dry-run --locked

  # Refuses before the crates-io approval is asked for, unless the run is at
  # the release tag of a crate at its manifest version and that tag has a
  # published GitHub release: this lane recovers a release, it never makes
  # one. It names the crate the publish job uploads.
  guard:
    name: release tag and release
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      crate: ${{ steps.guard.outputs.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - id: guard
        name: The run is at the release tag, which has a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "crate=$(bash scripts/release/publish-crates.sh guard)" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: guard
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ needs.guard.outputs.crate }}
        run: bash scripts/release/publish-crates.sh publish "$CRATE"
      - name: Verify the crate resolves at its manifest version
        if: always()
        env:
          CRATE: ${{ needs.guard.outputs.crate }}
        run: bash scripts/release/publish-crates.sh verify "$CRATE"

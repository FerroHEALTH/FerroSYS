# The reusable crate lane release.yml calls: package the crate the tag releases with no
# build cache, attest the .crate through Sigstore, and attach the file, its
# checksum and its attestation bundle to the draft release. A reusable
# workflow keeps the signing identity out of reach of caller-defined steps
# (SLSA v1.0 Build Level 3; GitHub, "Using artifact attestations and reusable
# workflows to achieve SLSA v1 Build Level 3").
name: Release crate

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag.
        required: true
        type: string
      version:
        description: The version the tag names.
        required: true
        type: string
      crate:
        description: The crate the tag releases.
        required: true
        type: string

permissions: {}

jobs:
  crate:
    name: package and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # attach the assets to the draft release
      id-token: write # Sigstore
      attestations: write # store the attestation against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Package the crate
        env:
          VERSION: ${{ inputs.version }}
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          case "$CRATE" in
            ferrohealth-secret | ferrohealth-config | ferrohealth-telemetry | ferrohealth-health | ferrohealth-server | ferrohealth-usage-report) ;;
            *) echo "::error::'$CRATE' is not a published member" >&2; exit 1 ;;
          esac
          cargo package -p "$CRATE" --locked
          file="target/package/${CRATE}-${VERSION}.crate"
          test -s "$file"
          cp "$file" .
          sha256sum "${CRATE}-${VERSION}.crate" > "${CRATE}-${VERSION}.crate.sha256sum"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.crate }}-${{ inputs.version }}.crate
      - name: Attach the crate, its checksum and its attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          CRATE: ${{ inputs.crate }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "${CRATE}-${VERSION}.crate.sigstore.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "${CRATE}-${VERSION}.crate" \
            "${CRATE}-${VERSION}.crate.sha256sum" \
            "${CRATE}-${VERSION}.crate.sigstore.json"

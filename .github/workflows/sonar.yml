# SonarQube Cloud analysis beside CodeQL. Advisory: it gates no merge, and a
# finding is fixed by hand in a normal change or recorded on the tracker with
# its reason. The scan scope lives in sonar-project.properties.
# SONAR_HOST_URL is not needed for SonarQube Cloud (SonarSource/
# sonarqube-scan-action README, v8.2.1).
name: SonarQube Cloud

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC

# It runs on a push to main and weekly, never on a pull request or a merge
# group: it gates no merge, and the org shares 20 concurrent jobs that the
# gates need (owner decision, 2026-11-25). A newer push to main replaces a
# running analysis.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # The PostgreSQL of the ferrohealth-perf cases, as in ci.yml's nextest job.
    services:
      postgres:
        image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      FERROHEALTH_PERF_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar assigns issues and new-code status by blame.
          fetch-depth: 0
          persist-credentials: false

      # The lcov file sonar.rust.lcov.reportPaths names, from the workspace
      # tests ci.yml's nextest job runs, with every feature on.
      - uses: ./.github/actions/setup-rust
        with:
          # llvm-tools-preview carries the profdata reader cargo-llvm-cov needs.
          components: llvm-tools-preview
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Instrumented tests to lcov
        run: |
          set -euo pipefail
          cargo llvm-cov nextest --workspace --all-features --locked --no-tests=pass --lcov --output-path lcov.info
          lines="$(grep -c '^DA:' lcov.info || true)"
          echo "lcov.info carries ${lines} line records"
          if [[ "${lines}" == "0" ]]; then
            echo "the coverage report is empty" >&2
            exit 1
          fi

      # No sonar.projectVersion: each crate carries its own version, so the
      # new-code window is the project's own setting.
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

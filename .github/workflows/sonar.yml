# SonarQube Cloud analysis beside CodeQL. Advisory: it gates no merge, and a
# finding is fixed by hand in a normal change or recorded on the tracker with
# its reason. The scan scope lives in sonar-project.properties.
# SONAR_HOST_URL is not needed for SonarQube Cloud (SonarSource/
# sonarqube-scan-action README, v8.2.1).
name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to a pull request cancels its running analysis. On main a
# running analysis finishes, so main is analyzed at its latest commit.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  scan:
    name: analyze
    # A fork or Dependabot pull request cannot read SONAR_TOKEN; the push to
    # main after the merge analyzes the merged result.
    if: github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read # PR decoration reads the pull-request metadata
    # The PostgreSQL of the ferrohealth-perf cases, as in ci.yml's nextest job.
    services:
      postgres:
        image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      FERROHEALTH_PERF_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar assigns issues and new-code status by blame.
          fetch-depth: 0
          persist-credentials: false

      # The lcov file sonar.rust.lcov.reportPaths names, from the workspace
      # tests ci.yml's nextest job runs, with every feature on.
      - uses: ./.github/actions/setup-rust
        with:
          # llvm-tools-preview carries the profdata reader cargo-llvm-cov needs.
          components: llvm-tools-preview
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Instrumented tests to lcov
        run: |
          set -euo pipefail
          cargo llvm-cov nextest --workspace --all-features --locked --no-tests=pass --lcov --output-path lcov.info
          lines="$(grep -c '^DA:' lcov.info || true)"
          echo "lcov.info carries ${lines} line records"
          if [[ "${lines}" == "0" ]]; then
            echo "the coverage report is empty" >&2
            exit 1
          fi

      # No sonar.projectVersion: each crate carries its own version, so the
      # new-code window is the project's own setting.
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# CI in four jobs and the conclusion (no specification governs this: our own
# design).
#
#   1. `guards` runs the workflow, shell and repository guards, the
#      forwarder ratchet and the publish dry run, all without a build cache.
#   2. `lint` runs rustfmt, clippy with and without every feature, the
#      wasm32 documents, rustdoc and cargo-deny over one build cache.
#   3. `nextest` runs the tests and the doctests.
#   4. `cargo-semver-checks` runs on a pull request and in the merge queue.
#
# Every job starts at once and pays one runner queue wait: the hosted runner
# pool is shared across the organisation, so each job pays the wait for a
# runner however short its work, and a job that waits on another pays it
# twice. That wait, not the work, made a run take 47 to 75 minutes, so the
# guards share one job, and each step there runs when an earlier one failed,
# so a run still reports every finding.
#
# The `conclusion` job is the single required status check on main, and the
# workflow runs on `merge_group`, so it serves a merge queue as it is.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: an `edited` run on the same commit would cancel this one
    # through the concurrency group and fail its `conclusion`.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Guards, no build cache ------------------------------------------------
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The crate version guard compares the pull request's base and head.
          fetch-depth: 0
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: zizmor@1.31.1,shellcheck@0.11.0
      - name: zizmor audits .github
        if: ${{ !cancelled() }}
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/
      - name: actionlint lints .github/workflows
        if: ${{ !cancelled() }}
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      - name: Every tracked shell program is clean at severity=style
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style
      - name: The release milestone script refuses open items and closes only after every leg
        if: ${{ !cancelled() }}
        run: bash scripts/release/milestone.sh --self-test
      - name: The release plan orders tags by version and counts the support period
        if: ${{ !cancelled() }}
        run: bash scripts/release/plan.sh --self-test
      - name: The changelog Security check passes and refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-security.sh --self-test
      - name: The manual crate publish refuses a run off its release tag
        if: ${{ !cancelled() }}
        run: bash scripts/release/publish-crates.sh --self-test
      - name: The label bootstrap creates the taxonomy and retires what it replaced
        if: ${{ !cancelled() }}
        run: bash scripts/gh/labels.sh --self-test
      # Every section of each crate's changelog (crates/<crate>/CHANGELOG.md)
      # holds Keep a Changelog types each once, and [Unreleased] keeps the
      # Security rules the release plan checks on the section it cuts.
      # Regulation (EU) 2024/2847 Annex I Part II(2), (4) and (8): every
      # Security entry names its GHSA advisory or VEX statement, and a
      # Security section beside other changes opens with its reason.
      - name: Every crate's changelog keeps the structure and the Security rules
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for changelog in crates/*/CHANGELOG.md; do
            bash scripts/checks/changelog-structure.sh "$changelog"
            VEX_ROOT=. bash scripts/checks/changelog-security.sh --section Unreleased "$changelog"
          done
      - name: Comment style
        if: ${{ !cancelled() }}
        run: bash scripts/checks/comment-style.sh --all
      # No first-party file claims a licence other than BUSL-1.1.
      - name: Licence headers
        if: ${{ !cancelled() }}
        run: bash scripts/checks/licence-headers.sh
      # The file-size ratchet: a hand-written Rust file is at most 800 lines,
      # and a listed breach may shrink and never grow
      # (`.claude/rules/rust-style.md` §File size).
      - name: File-size ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/file-size.sh --self-test
      - name: No file over the budget outside the list, and no listed file grew
        if: ${{ !cancelled() }}
        run: bash scripts/checks/file-size.sh
      # The duplication ratchet: the duplicated lines of the hand-written Rust
      # may fall and never rise (`.claude/rules/rust-style.md` §Code is
      # written once). jscpd runs from its image pinned in docs/VERSIONS.md; a
      # fall passes with a note and the ratchet-tighten lane records it.
      - name: Duplication ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh --self-test
      - name: The duplicated lines have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh
      - name: Every pending-work pointer names an open issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh
      - name: The crate version guard refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/crate-version-guard.sh --self-test
      - name: The version, the lock and the changelog agree
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"
      - name: Dependency review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
      # No cache from here on: tools/forwarders builds proc-macro2, quote and
      # syn alone, and the dry run checks the bytes a publish would upload.
      - uses: ./.github/actions/setup-rust
        if: ${{ !cancelled() }}
        with:
          cache: "false"
      # The forwarder ratchet: the functions whose whole body forwards to one
      # other call may fall and never rise (`.claude/rules/rust-style.md` §No
      # function only forwards to another).
      - name: Forwarder ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/forwarders.sh --self-test
      - name: The forwarders have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/forwarders.sh
      # NOTE: Cargo packages the workspace members together, so a crate verifies
      # against the workspace crates it depends on before those are on crates.io.
      - name: Publish dry run
        if: ${{ !cancelled() }}
        run: cargo publish --workspace --dry-run --locked

  # ---- Rust ------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      # Each crate is linted with its default features and with every
      # feature, the two builds a product links.
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy with every feature
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The documents a console's browser half reads compile for wasm32 with
      # no feature: today the readiness document of ferrohealth-health.
      - name: wasm32 documents
        if: ${{ !cancelled() }}
        run: cargo clippy -p ferrohealth-health --target wasm32-unknown-unknown --locked -- -D warnings
      - name: rustdoc
        if: ${{ !cancelled() }}
        run: cargo doc --locked --workspace --all-features --no-deps --document-private-items
      - name: cargo-deny
        if: ${{ !cancelled() }}
        run: cargo deny check
      # An `ignore` entry that outlived its finding: cargo-deny reports it as a
      # warning, so the step above stays green on one; this promotes it to an
      # error. Here because cargo-deny and the toolchain are installed.
      - name: No exception for an advisory that no longer fires
        if: ${{ !cancelled() }}
        run: bash scripts/checks/advisory-exceptions.sh

  test:
    name: nextest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The PostgreSQL whose pg_stat_database the ferrohealth-perf cases read,
    # pinned by digest in docs/VERSIONS.md; each case creates a database of
    # its own in it. On CI those cases fail when the URL is missing.
    services:
      postgres:
        image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      FERROHEALTH_PERF_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      # A crate that holds its name at 0.0.0 has no test yet, which is no
      # failure of the workspace.
      - run: cargo nextest run --workspace --locked --no-tests=warn
      - run: cargo nextest run --workspace --all-features --locked --no-tests=warn
      - run: cargo test --doc --workspace --all-features --locked

  # Every crate's public API against its newest version on crates.io, on the
  # default feature heuristic and with no default features: a break the
  # manifest version does not answer with a minor bump fails, and so does a
  # public dependency moved to another line without one, so the caret
  # requirements between the crates stay safe (scripts/checks/semver.sh).
  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The pull request's merge commit, or the merge group's commit, and its
      # first parent, the base, so the check judges only a change that
      # reaches a crate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: "false"
      - id: pin
        name: Read the cargo-semver-checks pin
        run: echo "version=$(bash scripts/checks/semver.sh --pin)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-semver-checks@${{ steps.pin.outputs.version }}
      - run: bash scripts/checks/semver.sh --changed HEAD^1

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  conclusion:
    name: conclusion
    needs:
      - guards
      - lint
      - test
      - semver
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"

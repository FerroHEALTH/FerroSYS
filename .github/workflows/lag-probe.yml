# Throwaway probe for #357; this branch is never merged.
name: Lag probe
on:
  push:
    branches: [test/perf-lag-probe]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host
        run: |
          nproc; uname -r; lscpu | grep 'Model name'; cat /proc/self/cgroup
          cat /proc/sys/kernel/sched_autogroup_enabled || true
          ls /sys/kernel/debug/sched 2>/dev/null || true
          ulimit -e; ulimit -r
      - name: Build
        run: cd probe && cargo build --release -q
      - name: Probe
        run: |
          set -u
          P=probe/target/release/lag-probe
          python3 -m http.server 18080 --bind 127.0.0.1 >/dev/null 2>&1 &
          python3 -m http.server 18081 --bind 127.0.0.1 >/dev/null 2>&1 &
          docker pull -q busybox:1.37
          sleep 1
          U="http://127.0.0.1:18080/ http://127.0.0.1:18081/"
          for hogs in 0 3 5 8; do
            ids=""
            for _ in $(seq 1 "$hogs"); do ids="$ids $(docker run -d --rm busybox:1.37 sh -c 'while :; do :; done')"; done
            sleep 2
            echo "=========== hogs=$hogs"
            uptime
            $P tokio 20 30 $U
            $P thread 20 30 $U
            echo "--- tokio under nice -10"
            sudo nice -n -10 $P tokio 20 30 $U
            echo "--- tokio under SCHED_FIFO 10"
            sudo chrt -f 10 $P tokio 20 30 $U
            [ -n "$ids" ] && docker kill $ids >/dev/null
          done

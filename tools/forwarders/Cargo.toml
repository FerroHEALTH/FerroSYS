[package]
name = "forwarders"
description = "Lists the hand-written functions whose whole body forwards to one other call, for the forwarder ratchet"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

# Reads source text only: it never depends on a workspace crate, so the
# ratchet builds in seconds and measures any tree it is pointed at.
[dependencies]
anyhow = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true

[package]
name = "ferrohealth-health"
description = "The health family of the FerroHEALTH products: the readiness document every server and console shares, and the indicator registry and lifecycle a server runs"
# Its own version line, released by the tag ferrohealth-health-v<version>.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["health", "readiness", "liveness", "probe", "healthcare"]
categories = ["web-programming"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

[features]
default = []
# The indicator trait, the registry that runs every indicator concurrently
# under a timeout, and the process lifecycle; a server takes it, a console's
# browser half does not.
registry = ["dep:tokio"]

[dependencies]
serde.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "time"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true

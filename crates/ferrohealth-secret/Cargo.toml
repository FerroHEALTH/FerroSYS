[package]
name = "ferrohealth-secret"
description = "The secret and redaction types of the FerroHEALTH products: secrets that never render, URLs with their credentials masked, and the key-or-file rule"
# Its own version line, released by the tag ferrohealth-secret-v<version>.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["secret", "redaction", "configuration", "healthcare"]
categories = ["config"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

# The third-party crates whose items the public API names, kept true by
# scripts/checks/public-surface.sh: a line move of one takes the next minor.
[package.metadata.ferrohealth]
public-dependencies = ["secrecy", "serde"]

[dependencies]
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true

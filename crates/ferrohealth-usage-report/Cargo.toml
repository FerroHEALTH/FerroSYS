[package]
name = "ferrohealth-usage-report"
description = "The installation report of the FerroHEALTH products to FerroPULSE: envelope v2, the instance id, the latency window and the start and daily reporter"
# Its own version line, released by the tag ferrohealth-usage-report-v<version>.
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["usage-report", "telemetry", "installation", "healthcare"]
categories = ["web-programming::http-client"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

[features]
default = []
# The `Recorder` through which the shared request log of
# ferrohealth-telemetry fills the window.
telemetry = ["dep:ferrohealth-telemetry"]
# `received`: a report read back under every rule of envelope v2, for the
# collector that receives it.
receive = []
# `schemars::JsonSchema` on the `[usage_report]` section and every type it
# holds, for a product that generates its configuration reference from its
# types.
schema = ["dep:schemars"]

[dependencies]
ferrohealth-telemetry = { workspace = true, features = ["axum"], optional = true }
http.workspace = true
jiff.workspace = true
reqwest.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
ferrohealth-config.workspace = true
jsonschema.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true

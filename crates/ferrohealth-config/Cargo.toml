[package]
name = "ferrohealth-config"
description = "The configuration loader of the FerroHEALTH products: a TOML file, environment overrides, strict checks with a suggestion, provenance per key, and the config check rendering"
# Its own version line, released by the tag ferrohealth-config-v<version>.
version = "0.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["configuration", "toml", "environment", "healthcare"]
categories = ["config"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

# The third-party crates whose items the public API names, kept true by
# scripts/checks/public-surface.sh: a line move of one takes the next minor.
[package.metadata.ferrohealth]
public-dependencies = ["schemars", "serde", "toml"]

[features]
default = []
# `schemars::JsonSchema` on `units::Duration`, `units::ByteSize`,
# `removed::Removed` and the `tls` types, for a product that generates its
# configuration reference from its types; the secret types bring their own.
schema = ["dep:schemars", "ferrohealth-secret/schema"]

[dependencies]
ferrohealth-secret.workspace = true
percent-encoding.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

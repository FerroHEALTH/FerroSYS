[package]
name = "ferrohealth-config"
description = "The configuration loader of the FerroHEALTH products: a TOML file, environment overrides, strict checks with a suggestion, provenance per key, and the config check rendering"
# Its own version line, released by the tag ferrohealth-config-v<version>.
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["configuration", "toml", "environment", "healthcare"]
categories = ["config"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

[dependencies]
ferrohealth-secret.workspace = true
percent-encoding.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

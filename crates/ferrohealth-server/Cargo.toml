[package]
name = "ferrohealth-server"
description = "The HTTP server plumbing of the FerroHEALTH products: the request id, the panic catch, the limits, the health routes, the bounded drain, the healthcheck and the CLI skeleton"
# Its own version line, released by the tag ferrohealth-server-v<version>.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["server", "axum", "health", "shutdown", "healthcare"]
categories = ["web-programming::http-server"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

[features]
default = []
# The browser security headers of an operator console: the nonce
# Content-Security-Policy and the headers beside it.
console = []

[dependencies]
axum = { workspace = true, features = ["tokio", "http1", "json"] }
clap.workspace = true
ferrohealth-health = { workspace = true, features = ["registry"] }
ferrohealth-telemetry = { workspace = true, features = ["axum"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "signal", "sync", "time", "macros", "io-util"] }
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
ferrohealth-config.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

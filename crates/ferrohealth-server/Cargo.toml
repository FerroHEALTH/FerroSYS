[package]
name = "ferrohealth-server"
description = "The HTTP server plumbing of the FerroHEALTH products: the request id, the panic catch, the limits, the health routes, the bounded drain, the healthcheck and the CLI skeleton"
# Its own version line, released by the tag ferrohealth-server-v<version>.
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["server", "axum", "health", "shutdown", "healthcare"]
categories = ["web-programming::http-server"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

[features]
default = []
# The browser security headers of an operator console: the nonce
# Content-Security-Policy and the headers beside it, and the same-origin
# check of its state-changing requests.
console = ["dep:url"]
# `tls_client::TlsClient::apply`, which sets the outbound TLS material on a
# reqwest client.
reqwest = ["dep:reqwest"]
# `revocation::RevocationCheck`, the outbound TLS that checks every
# certificate a peer presents by CRL, then OCSP, before any data is sent.
revocation = ["reqwest", "dep:aws-lc-rs", "dep:der", "dep:jiff", "dep:url", "dep:x509-cert", "dep:x509-ocsp"]

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
axum = { workspace = true, features = ["tokio", "http1", "json"] }
clap.workspace = true
der = { workspace = true, optional = true }
ferrohealth-secret.workspace = true
ferrohealth-health = { workspace = true, features = ["registry"] }
ferrohealth-telemetry = { workspace = true, features = ["axum"] }
http.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
ipnet.workspace = true
jiff = { workspace = true, optional = true }
pin-project-lite.workspace = true
reqwest = { workspace = true, optional = true }
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "signal", "sync", "time", "macros", "io-util"] }
tokio-rustls.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true
x509-cert = { workspace = true, optional = true }
x509-ocsp = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
ferrohealth-config.workspace = true
hyper = { workspace = true, features = ["http2"] }
rcgen.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[[bench]]
name = "stack"
harness = false

[lints]
workspace = true

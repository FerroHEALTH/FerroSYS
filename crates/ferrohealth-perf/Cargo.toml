[package]
name = "ferrohealth-perf"
description = "The performance gate of the FerroHEALTH servers: idle CPU and transaction limits, open-loop load latency, memory and CPU per request, judged against the change's base on the same host or a committed baseline"
# Its own version line, released by the tag ferrohealth-perf-v<version>.
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["performance", "benchmark", "ci", "healthcare"]
categories = ["command-line-utilities", "development-tools::profiling"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

[[bin]]
name = "ferrohealth-perf"
path = "src/main.rs"

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["env"] }
ferrohealth-secret.workspace = true
hdrhistogram.workspace = true
http.workspace = true
jiff.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
tokio-postgres.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true

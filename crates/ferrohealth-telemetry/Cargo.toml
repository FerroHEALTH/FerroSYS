[package]
name = "ferrohealth-telemetry"
description = "The telemetry of the FerroHEALTH products: the console, the request log that never carries a body, the panic hook, and one OpenTelemetry provider for traces and metrics"
# Its own version line, released by the tag ferrohealth-telemetry-v<version>.
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["telemetry", "tracing", "opentelemetry", "logging", "healthcare"]
categories = ["development-tools::debugging"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

[features]
default = []
# The OTLP export of spans and metrics over gRPC, with TLS to the collector.
otlp = ["dep:opentelemetry-otlp", "dep:rustls"]
# The Prometheus text exposition of the metrics.
prometheus = ["dep:opentelemetry-prometheus", "dep:prometheus"]
# The request-log middleware and the metrics route for axum.
axum = ["dep:axum", "dep:http"]

[dependencies]
ferrohealth-secret.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-prometheus = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
ferrohealth-config.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

[lints]
workspace = true

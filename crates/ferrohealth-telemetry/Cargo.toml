[package]
name = "ferrohealth-telemetry"
description = "The telemetry of the FerroHEALTH products: the console, the request log that never carries a body, the panic hook, and one OpenTelemetry provider for traces and metrics"
# Its own version line, released by the tag ferrohealth-telemetry-v<version>.
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["telemetry", "tracing", "opentelemetry", "logging", "healthcare"]
categories = ["development-tools::debugging"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

# The third-party crates whose items the public API names, kept true by
# scripts/checks/public-surface.sh: a line move of one takes the next minor.
[package.metadata.ferrohealth]
public-dependencies = [
  "axum",
  "http",
  "opentelemetry",
  "opentelemetry-otlp",
  "opentelemetry_sdk",
  "prometheus",
  "rustls",
  "schemars",
  "serde",
  "tonic",
  "tower",
  "tracing",
  "tracing-subscriber",
]

[features]
default = []
# The OTLP export of spans and metrics over gRPC, with TLS to the collector.
otlp = [
    "dep:opentelemetry-otlp",
    "dep:rustls",
    "dep:tonic",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:hyper-util",
    "dep:tower",
    "dep:http",
]
# The Prometheus text exposition of the metrics.
prometheus = ["dep:opentelemetry-prometheus", "dep:prometheus"]
# The request-log middleware and the metrics route for axum.
axum = ["dep:axum", "dep:http", "dep:pin-project-lite", "dep:tower"]
# `schemars::JsonSchema` on the `[telemetry]` section and every type it
# reaches, for a product that generates its configuration reference.
schema = ["dep:schemars", "ferrohealth-config/schema", "ferrohealth-secret/schema"]

[dependencies]
ferrohealth-config.workspace = true
ferrohealth-secret.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-prometheus = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net"] }
tokio-rustls = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
rcgen.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
tower.workspace = true

[lints]
workspace = true
